name: Hello World Workflow

on: 
    push:
        branches:
        - master
    

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello World
        run: echo "Hello World"
  say-goodbye:
    runs-on: ubuntu-latest
    steps:
        - name: Print Good Bye
          run: echo "Good Bye!"